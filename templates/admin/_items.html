<section class="card">
    <h2>Add an item</h2>
    <form action="{{ url_for('admin_items_add') }}" method="post" class="item-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field"><label>Name<input name="name" required placeholder="Pepperoni"></label></div>
        <div class="field"><label>Description<input name="description" placeholder="Red sauce, mozzarella, cup-and-char pepperoni"></label></div>
        <div class="field-row">
            <div class="field"><label>Price<input name="price" required inputmode="decimal" placeholder="14.00"></label></div>
            <div class="field"><label>Sort order<input name="sort_order" type="number" value="0"></label></div>
        </div>
        <button type="submit" class="btn-primary">Add item</button>
    </form>
</section>
