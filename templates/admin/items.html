{% extends "layout.html" %}

{% block title %}Menu items — Pushin' Pizza admin{% endblock %}

{% block main %}
<h1>Menu items</h1>

<section class="card">
    <h2>Add an item</h2>
    <form action="{{ url_for('admin_items_add') }}" method="post" class="item-form">
        <div class="field"><label>Name<input name="name" required placeholder="Pepperoni"></label></div>
        <div class="field"><label>Description<input name="description" placeholder="Red sauce, mozzarella, cup-and-char pepperoni"></label></div>
        <div class="field-row">
            <div class="field"><label>Price<input name="price" required inputmode="decimal" placeholder="14.00"></label></div>
            <div class="field"><label>Sort order<input name="sort_order" type="number" value="0"></label></div>
        </div>
        <button type="submit" class="btn-primary">Add item</button>
    </form>
</section>

{% for item in items %}
<section class="card {{ 'inactive' if not item.active }}">
    <form action="{{ url_for('admin_items_edit', item_id=item.id) }}" method="post" class="item-form">
        <div class="field"><label>Name<input name="name" value="{{ item.name }}" required></label></div>
        <div class="field"><label>Description<input name="description" value="{{ item.description }}"></label></div>
        <div class="field-row">
            <div class="field"><label>Price<input name="price" value="{{ '%.2f' | format(item.price_cents / 100) }}" required inputmode="decimal"></label></div>
            <div class="field"><label>Sort order<input name="sort_order" type="number" value="{{ item.sort_order }}"></label></div>
        </div>
        <div class="btn-row">
            <button type="submit">Save</button>
            <button type="submit" formaction="{{ url_for('admin_items_toggle', item_id=item.id) }}">
                {{ 'Deactivate' if item.active else 'Reactivate' }}
            </button>
            {% if not item.active %}<span class="tag">inactive</span>{% endif %}
        </div>
    </form>
</section>
{% else %}
<p class="empty-state">No menu items yet — add your first pizza above.</p>
{% endfor %}
{% endblock %}
