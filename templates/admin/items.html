{% extends "layout.html" %}

{% block title %}Menu items — Pushin' Pizza admin{% endblock %}

{% block main %}
<h1>Menu items</h1>

{% include '/admin/_items.html'%}

{% for item in items %}
<section class="card {{ 'inactive' if not item.active }}">
    <form action="{{ url_for('admin.items_edit', item_id=item.id) }}" method="post" class="item-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field"><label>Name<input name="name" value="{{ item.name }}" required></label></div>
        <div class="field"><label>Description<input name="description" value="{{ item.description }}"></label></div>
        <div class="field-row">
            <div class="field"><label>Price<input name="price" value="{{ '%.2f' | format(item.price_cents / 100) }}" required inputmode="decimal"></label></div>
            <div class="field"><label>Sort order<input name="sort_order" type="number" value="{{ item.sort_order }}"></label></div>
        </div>
        <div class="btn-row">
            <button type="submit">Save</button>
            <button type="submit" formaction="{{ url_for('admin.items_toggle', item_id=item.id) }}">
                {{ 'Deactivate' if item.active else 'Reactivate' }}
            </button>
            {% if not item.active %}<span class="tag">inactive</span>{% endif %}
        </div>
    </form>
</section>
{% endfor %}

<script src="{{ url_for('static', filename='item_list.js') }}"></script>
{% endblock %}
